schema: spec-driven

context: |
  This is the static hitchhiking.org landing site, deployed from the main branch.
  The public pages are plain HTML, CSS and browser JavaScript; the landing page is
  index.html and shared styles live in assets/site.css. The /chat page prototypes
  passwordless Matrix onboarding using verified NIP-05 identities from Hitchwiki
  or Trustroots. Preserve the warm Hitchwiki visual style and keep the site usable
  on narrow mobile screens.
  Avoid adding a build system unless a change genuinely needs one. Use concise,
  descriptive commit messages and validate HTML/CSS/JavaScript changes before
  shipping.

