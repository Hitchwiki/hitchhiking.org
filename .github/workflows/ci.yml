name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test public source
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run tests and source checks
        run: npm test

      - name: Validate release scripts without executing them
        run: bash -n scripts/*.sh

      - name: Verify a clean release snapshot
        run: scripts/export-release.sh "$RUNNER_TEMP/hitchhiking.org-release"
