name: Refresh hitchhiking map

on:
  schedule:
    - cron: '0 0 1 * *' # 00:00 UTC on the first day of every month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run script to update index.html
        run: python3 heatmap.py

      - name: Commit the refreshed map
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add index.html
          git commit -m "Refresh hitchhiking map" || echo "No map changes to commit"
          git push
